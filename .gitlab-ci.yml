# Pipeline stages
stages:
  - pre-validate
  - validate
  - build
  - publish
  - cleanup

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Workflow
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Pip cache
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# Default Python image and bootstrap
default:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-alpine
  tags:
    - ics-docker
  before_script:
    - python -m pip install --upgrade pip setuptools wheel

# Version check: block MR if version hasn't been incremented compared to main
version:check:
  stage: pre-validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-alpine
  before_script:
    - apk add git
    - git fetch origin main
  script:
    - |
      LOCAL_VER=$(grep 'version=' setup.py | head -1 | cut -d'"' -f2)
      REMOTE_VER=$(git show origin/main:setup.py | grep 'version=' | head -1 | cut -d'"' -f2)
      echo "Local version: $LOCAL_VER, Remote (main) version: $REMOTE_VER"
      if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
        echo "Error: Fair3R version must be incremented before merging (current: $LOCAL_VER)";
        exit 1;
      fi
      echo "Version check passed: $LOCAL_VER > $REMOTE_VER"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

# Linting (ruff)
lint:ruff:
  stage: validate
  script:
    - pip install ruff==0.16.0
    - |
      set +e
      ruff check ckanext > ruff.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-check --input ruff.out --xml report-ruff.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff.xml
    paths:
      - report-ruff.xml

# Format check (ruff format)
lint:ruff-format:
  stage: validate
  script:
    - pip install ruff==0.16.0
    - |
      set +e
      ruff format --check ckanext > ruff-format.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-format --input ruff-format.out --xml report-ruff-format.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff-format.xml
    paths:
      - report-ruff-format.xml

# Security scan (bandit)
security:bandit:
  stage: validate
  script:
    - pip install bandit
    - bandit -r ckanext -x ckanext/fair3r/tests -f json -o report-bandit.json || true
    - python .ci/junit_report.py bandit --json report-bandit.json --xml report-bandit.xml
  artifacts:
    when: always
    reports:
      junit: report-bandit.xml
    paths:
      - report-bandit.xml
      - report-bandit.json

# Python dependency audit
security:pip-audit:
  stage: validate
  allow_failure: true
  script:
    - pip install pip-audit
    - pip-audit -f json -o report-pip-audit.json || true
    - python .ci/junit_report.py pip-audit --json report-pip-audit.json --xml report-pip-audit.xml
  artifacts:
    when: always
    reports:
      junit: report-pip-audit.xml
    paths:
      - report-pip-audit.xml
      - report-pip-audit.json

# Build Python package
build:package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/

# Publish python package to our gitlab PyPI (automatic)
publish:pypi:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  needs:
    - build:package
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
    TWINE_REPOSITORY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel twine
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - test -d dist && ls -l dist
    - python3 -c "import os,sys; ok=bool(os.getenv('TWINE_USERNAME')) and bool(os.getenv('TWINE_PASSWORD')); print('Twine env present:', ok); sys.exit(0 if ok else 1)"
    - twine upload --non-interactive dist/*

# Publish python package preview to our gitlab PyPI (automatic)
# Publishes the current version from setup.py as-is; deleted from registry after validation.
# Uses MR IID to make each preview version unique across concurrent MRs.
# Modifies setup.py temporarily to inject the MR IID into the version.
publish:pypi:preview:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
    TWINE_REPOSITORY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel build twine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
  script:
    - rm -rf dist/
    - |
      python3 - <<'EOF'
      import re, os, pathlib
      p = pathlib.Path('setup.py')
      t = p.read_text()
      mr_iid = os.environ.get('CI_MERGE_REQUEST_IID', '')
      if mr_iid:
          t = re.sub(r'(version="([^"]+)")', r'version="\2+mr' + mr_iid + r'"', t)
          p.write_text(t)
      EOF
    - python3 -m build
    - twine check dist/*
    - |
      python3 - <<'EOF'
      import json, os, re, pathlib, urllib.request, urllib.error

      version = re.search(r'version="([^"]+)"', pathlib.Path("setup.py").read_text()).group(1)
      mr_iid = os.environ.get("CI_MERGE_REQUEST_IID", "")
      preview_version = f"{version}+mr{mr_iid}" if mr_iid else version
      api     = os.environ["CI_API_V4_URL"]
      project = os.environ["CI_PROJECT_ID"]
      token   = os.environ["CI_JOB_TOKEN"]
      headers = {"JOB-TOKEN": token}

      print(f"Publishing preview package {preview_version} (MR #{mr_iid})...")

      url = f"{api}/projects/{project}/packages?package_name=ckanext-fair3r&package_version={preview_version}&package_type=pypi"
      req = urllib.request.Request(url, headers=headers)
      with urllib.request.urlopen(req) as r:
          pkgs = json.load(r)

      if pkgs:
          pkg_id = pkgs[0]["id"]
          print(f"Deleting existing preview package {preview_version} (id={pkg_id}) before re-upload...")
          del_req = urllib.request.Request(f"{api}/projects/{project}/packages/{pkg_id}", headers=headers, method="DELETE")
          try:
              urllib.request.urlopen(del_req)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"DELETE failed: {e.code} {e.reason}")
          print("Deleted.")
      else:
          print(f"No existing preview package {preview_version} found, proceeding with upload.")
      EOF
    - twine upload --non-interactive dist/*
# Trigger deploy pipeline in fair3r-docker-alt starting from integration (automatic)
# Launches the full pipeline: ansible_lint → deploy_integration → deploy_validation.
trigger:fair3r-docker-alt:integration:
  stage: publish
  needs:
    - job: publish:pypi:preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
  variables:
    FAIR3R_PLUGIN_REF: $CI_COMMIT_REF_NAME
    CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
  trigger:
    project: ics/fair3r-docker-alt
    branch: main
    strategy: depend

# Delete preview package from registry after validation (automatic)
# Uses the GitLab Packages API to delete the preview package.
cleanup:pypi:preview:
  stage: cleanup
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  needs:
    - job: trigger:fair3r-docker-alt:integration
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never
  script:
    - |
      python3 - <<'PYEOF'
      import json, os, pathlib, re, urllib.request, urllib.error

      version = re.search(r'version="([^"]+)"', pathlib.Path("setup.py").read_text()).group(1)
      mr_iid = os.environ.get("CI_MERGE_REQUEST_IID", "")
      preview_version = f"{version}+mr{mr_iid}" if mr_iid else version
      api = os.environ["CI_API_V4_URL"]
      project = os.environ["CI_PROJECT_ID"]
      token = os.environ["CI_JOB_TOKEN"]
      headers = {"JOB-TOKEN": token}

      print(f"Deleting preview package {preview_version} from registry...")

      # List packages via the GitLab Packages API (without package_version filter)
      url = f"{api}/projects/{project}/packages?package_name=ckanext-fair3r&package_type=pypi"
      req = urllib.request.Request(url, headers=headers)
      with urllib.request.urlopen(req) as r:
          pkgs = json.load(r)

      print(f"Found {len(pkgs)} package(s) in registry")

      # Find the exact preview package to delete
      target = None
      for pkg in pkgs:
          if pkg.get("version") == preview_version:
              target = pkg
              break

      if not target:
          raise SystemExit(f"Package {preview_version} not found in registry. Available versions: {[p.get('version') for p in pkgs]}")

      pkg_id = target["id"]
      print(f"Found package ID: {pkg_id}")

      # Delete via the GitLab Packages API
      del_req = urllib.request.Request(
          f"{api}/projects/{project}/packages/{pkg_id}",
          headers=headers,
          method="DELETE"
      )
      try:
          urllib.request.urlopen(del_req)
      except urllib.error.HTTPError as e:
          raise SystemExit(f"DELETE failed: {e.code} {e.reason}")

      print(f"Package {preview_version} deleted from registry.")
      PYEOF
