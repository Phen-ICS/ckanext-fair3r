# Pipeline stages
stages:
  - pre-validate
  - validate
  - build
  - publish

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Workflow
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Pip cache
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# Default Python image and bootstrap
default:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-alpine
  tags:
    - ics-docker
  before_script:
    - python -m pip install --upgrade pip setuptools wheel

# Version check: block MR if version hasn't been incremented compared to main
version:check:
  stage: pre-validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-alpine
  before_script:
    - apk add git
    - git fetch origin main
  script:
    - |
      LOCAL_VER=$(grep 'version=' setup.py | head -1 | cut -d'"' -f2)
      REMOTE_VER=$(git show origin/main:setup.py | grep 'version=' | head -1 | cut -d'"' -f2)
      echo "Local version: $LOCAL_VER, Remote (main) version: $REMOTE_VER"
      if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
        echo "Error: Fair3R version must be incremented before merging (current: $LOCAL_VER)";
        exit 1;
      fi
      echo "Version check passed: $LOCAL_VER > $REMOTE_VER"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

# Linting (ruff)
lint:ruff:
  stage: validate
  script:
    - pip install ruff==0.16.0
    - |
      set +e
      ruff check ckanext > ruff.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-check --input ruff.out --xml report-ruff.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff.xml
    paths:
      - report-ruff.xml

# Format check (ruff format)
lint:ruff-format:
  stage: validate
  script:
    - pip install ruff==0.16.0
    - |
      set +e
      ruff format --check ckanext > ruff-format.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-format --input ruff-format.out --xml report-ruff-format.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff-format.xml
    paths:
      - report-ruff-format.xml

# Security scan (bandit)
security:bandit:
  stage: validate
  script:
    - pip install bandit
    - bandit -r ckanext -x ckanext/fair3r/tests -f json -o report-bandit.json || true
    - python .ci/junit_report.py bandit --json report-bandit.json --xml report-bandit.xml
  artifacts:
    when: always
    reports:
      junit: report-bandit.xml
    paths:
      - report-bandit.xml
      - report-bandit.json

# Python dependency audit
security:pip-audit:
  stage: validate
  allow_failure: true
  script:
    - pip install pip-audit
    - pip-audit -f json -o report-pip-audit.json || true
    - python .ci/junit_report.py pip-audit --json report-pip-audit.json --xml report-pip-audit.xml
  artifacts:
    when: always
    reports:
      junit: report-pip-audit.xml
    paths:
      - report-pip-audit.xml
      - report-pip-audit.json

# Build Python package
build:package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    # fair3r-docker-alt fetches this job's artifact by ID (see
    # trigger:fair3r-docker-alt:integration below) rather than by ref+job
    # name, since the "latest successful pipeline" lookup can't resolve
    # while this same pipeline is still running (blocked on that trigger).
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      dotenv: build.env

# Publish python package to the public PyPI (pypi.org, automatic).
# Requires a PYPI_API_TOKEN CI/CD variable (masked) holding a pypi.org API
# token for this package. Automatic on every push to main: validation and
# production install extensions straight from public PyPI (no version
# pinned, no private registry), so a merged fix must land there promptly
# or those environments silently keep running the previous version.
# version:check already guarantees every merge bumps the version, so
# there's no risk of trying to re-upload an existing PyPI version.
publish:pypi:public:
  stage: publish
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  needs:
    - build:package
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "$PYPI_API_TOKEN"
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel twine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - test -d dist && ls -l dist
    - twine upload --non-interactive dist/*

# Trigger deploy pipeline in fair3r-docker-alt starting from integration (automatic)
# Launches the full pipeline: ansible_lint → deploy_integration → deploy_validation.
# fair3r-docker-alt fetches this MR's build:package wheel directly via
# needs:project (see its .gitlab-ci.yml fetch:preview:fair3r job) — no
# publish/registry step needed on this side.
trigger:fair3r-docker-alt:integration:
  stage: publish
  needs:
    - job: build:package
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: never
  variables:
    FAIR3R_PLUGIN_REF: $CI_COMMIT_REF_NAME
    FAIR3R_BUILD_JOB_ID: $BUILD_JOB_ID
    CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
  trigger:
    project: ics/fair3r-docker-alt
    branch: main
    strategy: depend

