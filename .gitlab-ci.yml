# Pipeline stages
stages:
  - validate
  - build
  - publish

# Global variables
variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# Workflow
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Pip cache
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

# Default Python image and bootstrap
default:
  image: python:3.10-alpine
  tags:
    - ics-docker
  before_script:
    - python -m pip install --upgrade pip setuptools wheel

# Linting (ruff)
lint:ruff:
  stage: validate
  script:
    - pip install ruff
    - |
      set +e
      ruff check ckanext > ruff.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-check --input ruff.out --xml report-ruff.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff.xml
    paths:
      - report-ruff.xml

# Format check (ruff format)
lint:ruff-format:
  stage: validate
  script:
    - pip install ruff
    - |
      set +e
      ruff format --check ckanext > ruff-format.out 2>&1
      status=$?
      python .ci/junit_report.py ruff-format --input ruff-format.out --xml report-ruff-format.xml --status "$status"
      set -e
      test $status -eq 0
  artifacts:
    when: always
    reports:
      junit: report-ruff-format.xml
    paths:
      - report-ruff-format.xml

# Security scan (bandit)
security:bandit:
  stage: validate
  script:
    - pip install bandit
    - bandit -r ckanext -x ckanext/fair3r/tests -f json -o report-bandit.json || true
    - python .ci/junit_report.py bandit --json report-bandit.json --xml report-bandit.xml
  artifacts:
    when: always
    reports:
      junit: report-bandit.xml
    paths:
      - report-bandit.xml
      - report-bandit.json

# Python dependency audit
security:pip-audit:
  stage: validate
  allow_failure: true
  script:
    - pip install pip-audit
    - pip-audit -f json -o report-pip-audit.json || true
    - python .ci/junit_report.py pip-audit --json report-pip-audit.json --xml report-pip-audit.xml
  artifacts:
    when: always
    reports:
      junit: report-pip-audit.xml
    paths:
      - report-pip-audit.xml
      - report-pip-audit.json

# Build Python package
build:package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/

# Publish python package to our gitlab PyPI (manual)
publish:pypi:
  stage: publish
  image: python:3.10-slim
  needs:
    - build:package
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "$CI_JOB_TOKEN"
    TWINE_REPOSITORY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  before_script:
    - python3 -m pip install --upgrade pip setuptools wheel twine
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  script:
    - test -d dist && ls -l dist
    - python3 -c "import os,sys; ok=bool(os.getenv('TWINE_USERNAME')) and bool(os.getenv('TWINE_PASSWORD')); print('Twine env present:', ok); sys.exit(0 if ok else 1)"
    - twine upload --non-interactive dist/*
