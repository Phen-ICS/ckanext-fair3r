{% ckan_extends %}

{% block content_action %}
  {{ super() }}
  {% if h.check_access('package_update', {'id': pkg.id }) %}
    <a class="btn btn-default" href="{{ h.url_for(pkg.type ~ '_resource.new', id=pkg.name) }}">
      <i class="fa fa-file-alt"></i> {{ _('Add resource') }}
    </a>
  {% endif %}
  {% if h.check_access('package_show', {'id': pkg.id }) and pkg.resources %}
    <a class="btn btn-primary" href="{{ h.url_for('download_all.download', id=pkg.name) }}">
      <i class="fa fa-download"></i> {{ _('Download all') }}
    </a>
  {% endif %}
{% endblock %}
